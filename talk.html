<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LANParty VC – Call</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="lp-body">
  <div class="lp-stars"></div>
  <div class="lp-stars lp-stars-2"></div>
  <div class="lp-stars lp-stars-3"></div>

  <div class="lp-container">
    <header class="lp-header">
      <div>
        <p class="lp-subtitle" id="user-label"></p>
        <p class="lp-room-label">
          Room: <strong id="room-title"></strong>
          <button id="copy-room-btn" class="lp-button lp-button-secondary" type="button">
            Copy code
          </button>
        </p>
      </div>
      <button id="leave-btn" class="lp-button lp-button-danger" type="button">Leave</button>
    </header>

    <main class="lp-main">
      <section class="lp-card">
        <h2 class="lp-section-title">Participants</h2>
        <ul id="peers-list" class="lp-list"></ul>
      </section>

      <section class="lp-card">
        <h2 class="lp-section-title">Controls</h2>
        <div class="lp-audio-controls">
          <button id="mute-btn" class="lp-button lp-button-secondary" type="button" disabled>Mute</button>
          <button id="device-btn" class="lp-button lp-button-secondary" type="button" disabled>Switch Mic</button>
        </div>

        <p id="status" class="lp-status">Connecting…</p>
      </section>
    </main>
  </div>

  <script src="talk.js"></script>
  <script src="app.js"></script>
</body>
</html>
